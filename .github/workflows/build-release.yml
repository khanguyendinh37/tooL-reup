name: Build Release

# Trigger on version tags (v1.0.0, v1.2.3, ...) and manual dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản (ví dụ: 1.0.0). Bỏ trống nếu push tag v*."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build Windows onedir, zip bằng PowerShell (có sẵn, không cần 7z).
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Code signing runs only when the Azure Artifact Signing secrets exist
      # (see videodub/desktop/RELEASE.md). Without them the build still
      # succeeds but SmartScreen warns customers.
      HAS_WIN_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
      VIDEODUB_PUBLISHER: ${{ vars.VIDEODUB_PUBLISHER || 'VideoDub' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VIDEODUB_VERSION=${version:-0.0.0}" >> "$GITHUB_ENV"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "videodub/frontend/package-lock.json"

      - name: Install FFmpeg (Chocolatey)
        run: |
          choco install ffmpeg -y --no-progress
          "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> $env:GITHUB_PATH

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Build Windows Desktop
        # VIDEODUB_VERSION / VIDEODUB_PUBLISHER are read by VideoDub.spec.
        shell: cmd
        working-directory: videodub
        run: |
          call desktop\build.bat

      - name: Verify source and packaged Windows runtime
        shell: pwsh
        run: |
          $env:PATH = "$pwd\videodub\desktop\vendor\ffmpeg;" + $env:PATH
          $env:VIDEODUB_DATA_DIR = "$env:RUNNER_TEMP\videodub-check"
          $env:PYTHONPATH = "$pwd\videodub\backend"
          & videodub/backend/.venv/Scripts/python.exe -m app.core.runtime_check source-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & videodub/backend/.venv/Scripts/python.exe videodub/desktop/verify_build.py videodub/desktop/dist/VideoDub/VideoDub.exe source-runtime.json frozen-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-reports
          path: '*-runtime.json'
          if-no-files-found: warn

      - name: Sign VideoDub.exe (Azure Artifact Signing)
        if: env.HAS_WIN_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\videodub\desktop\dist\VideoDub\VideoDub.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
            }
            "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH
          }

      - name: Build Windows installer
        shell: cmd
        working-directory: videodub/desktop
        run: |
          call installer\build_installer.bat %VIDEODUB_VERSION%

      - name: Sign installer (Azure Artifact Signing)
        if: env.HAS_WIN_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\videodub\desktop\dist\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Zip portable Windows build (PowerShell)
        shell: pwsh
        run: |
          Compress-Archive `
            -Path videodub/desktop/dist/VideoDub `
            -DestinationPath "videodub/desktop/dist/installer/VideoDub-$env:VIDEODUB_VERSION-windows-portable.zip" `
            -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: videodub/desktop/dist/installer/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) Build macOS .app, zip bằng `ditto` (preserve bundle metadata).
  # ---------------------------------------------------------------------------
  # Apple Silicon only: torch>=2.3 publishes no macOS x86_64 wheels, so an
  # Intel build is not possible with the pinned dependencies.
  build-macos:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      # Developer ID signing + notarization run only when the secrets exist
      # (see videodub/desktop/RELEASE.md); otherwise the app is ad-hoc signed.
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
      VIDEODUB_PUBLISHER: ${{ vars.VIDEODUB_PUBLISHER || 'VideoDub' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          echo "VIDEODUB_VERSION=${version:-0.0.0}" >> "$GITHUB_ENV"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "videodub/frontend/package-lock.json"

      - name: Verify Xcode Command Line Tools
        run: |
          if ! xcode-select -p &>/dev/null; then
            echo "::error::Xcode Command Line Tools not found. macos-latest runners should have it pre-installed."
            exit 1
          fi
          echo "Xcode CLT: $(xcode-select -p)"

      - name: Install FFmpeg (Homebrew)
        run: brew install ffmpeg

      - name: Build macOS Desktop
        run: |
          chmod +x videodub/desktop/build_macos.sh
          ./videodub/desktop/build_macos.sh

      - name: Verify source and packaged macOS runtime
        run: |
          export PATH="$PWD/videodub/desktop/vendor/ffmpeg:$PATH"
          export VIDEODUB_DATA_DIR="$RUNNER_TEMP/videodub-check"
          export PYTHONPATH="$PWD/videodub/backend"
          videodub/backend/.venv/bin/python -m app.core.runtime_check source-runtime.json
          videodub/backend/.venv/bin/python videodub/desktop/verify_build.py videodub/desktop/dist/VideoDub.app/Contents/MacOS/VideoDub source-runtime.json frozen-runtime.json

      - name: Upload macOS runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-runtime-reports
          path: '*-runtime.json'
          if-no-files-found: warn

      - name: Import Developer ID certificate
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/videodub-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign, build DMG and notarize
        env:
          MACOS_SIGN_IDENTITY: ${{ env.HAS_MAC_SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x videodub/desktop/macos/package_macos.sh
          ./videodub/desktop/macos/package_macos.sh "$VIDEODUB_VERSION"

      # Runs after signing so a missing hardened-runtime entitlement shows up
      # here instead of on a customer's Mac.
      - name: Verify native macOS window and Finder launch
        run: |
          videodub/backend/.venv/bin/python videodub/desktop/verify_startup.py videodub/desktop/dist/VideoDub.app/Contents/MacOS/VideoDub macos-startup/direct
          videodub/backend/.venv/bin/python videodub/desktop/verify_startup.py videodub/desktop/dist/VideoDub.app/Contents/MacOS/VideoDub macos-startup/finder --finder

      - name: Print macOS startup logs
        if: always()
        run: |
          if [ -d macos-startup ]; then
            find macos-startup -type f \( -name '*.log' -o -name 'startup.json' \) -print -exec tail -n 100 {} \;
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: videodub/desktop/dist/VideoDub-*-macos-*.dmg
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3) Tạo GitHub Release 1 lần duy nhất với cả 2 file zip.
  #    Chạy trên ubuntu (rẻ hơn, không cần Windows/macOS runner).
  # ---------------------------------------------------------------------------
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: VideoDub ${{ github.event.inputs.version || github.ref_name }}
          files: |
            artifacts/*
          generate_release_notes: true
          body: |
            ## VideoDub Desktop

            Tải bản phù hợp với máy của bạn:

            | Nền tảng | File | Yêu cầu |
            |----------|------|---------|
            | 🪟 **Windows** (khuyên dùng) | `VideoDub-Setup-<phiên bản>.exe` | Windows 10/11 64-bit, RAM 8 GB+ (16 GB cho video dài) |
            | 🪟 Windows bản portable | `VideoDub-<phiên bản>-windows-portable.zip` | Như trên + WebView2 Runtime |
            | 🍎 **macOS** | `VideoDub-<phiên bản>-macos-arm64.dmg` | Mac chip Apple (M1 trở lên). Mac Intel không được hỗ trợ |

            ### Cài đặt

            **Windows**: chạy `VideoDub-Setup-….exe` → Next → Install. Không cần quyền admin;
            bộ cài tự cài WebView2 nếu máy thiếu và tạo shortcut ở Start Menu / Desktop.
            Dữ liệu lưu tại `%LOCALAPPDATA%\VideoDub\` và được giữ lại khi cập nhật hoặc gỡ cài đặt.

            **macOS**: mở file `.dmg` → kéo `VideoDub` vào thư mục `Applications`.
            Dữ liệu lưu tại `~/.local/share/VideoDub/`.

            Lần đầu lồng tiếng, ứng dụng tải model nhận dạng giọng nói (~500 MB) nên cần có mạng.

            ### Backend API (chỉ dev)
            - API: http://localhost:8000
            - Docs: http://localhost:8000/docs

            Xem chi tiết build & troubleshooting:
            - [videodub/desktop/README.md](videodub/desktop/README.md)
            - [videodub/desktop/README_desktop_macos.md](videodub/desktop/README_desktop_macos.md)

  # ---------------------------------------------------------------------------
  # 4) Auto-bump link download trong README.md ở root.
  #    Chỉ chạy khi push tag (workflow_dispatch không có github.ref_name).
  # ---------------------------------------------------------------------------
  update-readme:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Cần lịch sử đầy đủ để push lại nếu cần.
          fetch-depth: 0

      - name: Bump download links in README
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          if [ ! -f README.md ]; then
            echo "::error::README.md not found at repo root."
            exit 1
          fi

          # Replace 2 placeholder. Dùng delimiter | để tránh xung đột với URL có /.
          sed -i.bak \
            -e "s|<!-- LATEST_VERSION -->|${TAG}|g" \
            -e "s|<!-- LATEST_RELEASE_URL -->|${RELEASE_URL}|g" \
            README.md
          rm -f README.md.bak

          echo "----- Diff after bump -----"
          git diff -- README.md || true
          echo "---------------------------"

          if git diff --quiet -- README.md; then
            echo "No changes — already up to date."
            exit 0
          fi

      - name: Commit bumped README
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: bump download links to ${TAG}"
          git push
