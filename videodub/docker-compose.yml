version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videodub-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/temp:/app/temp
      - ./backend/output:/app/output
      - ./backend/cookies:/app/cookies
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/videodub.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # GPU support (uncomment if you have NVIDIA GPU and nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - videodub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: videodub-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - videodub-network

volumes:
  backend_data:

networks:
  videodub-network:
    driver: bridge