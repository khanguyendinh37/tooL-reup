<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#0ea5e9"/>
  <!-- robot head -->
  <rect x="6" y="7" width="18" height="14" rx="4" fill="white"/>
  <!-- antenna -->
  <line x1="12" y1="7" x2="12" y2="4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="3" r="1.2" fill="white"/>
  <!-- eyes -->
  <circle cx="10" cy="13" r="1.2" fill="#0ea5e9"/>
  <circle cx="16" cy="13" r="1.2" fill="#0ea5e9"/>
  <!-- mouth grille -->
  <rect x="9" y="17" width="12" height="1.2" rx="0.6" fill="#0ea5e9" fill-opacity="0.55"/>
  <rect x="10" y="19" width="1.5" height="1" rx="0.5" fill="#0ea5e9" fill-opacity="0.55"/>
  <rect x="13" y="19" width="1.5" height="1" rx="0.5" fill="#0ea5e9" fill-opacity="0.55"/>
  <rect x="16" y="19" width="1.5" height="1" rx="0.5" fill="#0ea5e9" fill-opacity="0.55"/>
  <rect x="19" y="19" width="1.5" height="1" rx="0.5" fill="#0ea5e9" fill-opacity="0.55"/>
  <!-- body base -->
  <rect x="8" y="21" width="14" height="5" rx="2" fill="white" fill-opacity="0.9"/>
  <circle cx="11" cy="23.5" r="0.8" fill="#0ea5e9"/>
  <circle cx="14" cy="23.5" r="0.8" fill="#22c55e"/>
  <circle cx="17" cy="23.5" r="0.8" fill="#f59e0b"/>
  <!-- microphone -->
  <rect x="24" y="11" width="6" height="10" rx="3" fill="white"/>
  <line x1="25.5" y1="14" x2="28.5" y2="14" stroke="#0ea5e9" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="25.5" y1="16" x2="28.5" y2="16" stroke="#0ea5e9" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="25.5" y1="18" x2="28.5" y2="18" stroke="#0ea5e9" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M22 16 Q22 22 27 22 Q32 22 32 16" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <line x1="27" y1="22" x2="27" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="27" x2="30" y2="27" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>